spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:safeops_local}
    username: ${DB_USERNAME:safeops_local}
    password: ${DB_PASSWORD:safeops_local}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: true

management:
  endpoint:
    health:
      show-details: always

springdoc:
  swagger-ui:
    enabled: true

safeops:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://10.0.2.2:8080}

logging:
  level:
    root: INFO
    com.safeops: DEBUG
    org.springframework.security: DEBUG
    org.flywaydb: INFO
